<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar - AquaSmart CRM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f8fafc;
            color: #1f2937;
        }

        .login-card {
            border: 0;
            border-radius: 8px;
            box-shadow: 0 0.35rem 1rem rgba(15, 23, 42, 0.08);
        }

        .action-button {
            min-height: 48px;
            font-weight: 700;
        }
    </style>
</head>

<body>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5">
            <div class="text-center mb-4">
                <h1 class="h4 mb-1">AquaSmart CRM</h1>
                <p class="text-muted mb-0">Iniciar sesión</p>
            </div>

            <section class="card login-card">
                <div class="card-body">
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label" for="{{ form.username.id_for_label }}">
                                Usuario
                            </label>
                            <input
                                type="text"
                                name="{{ form.username.html_name }}"
                                id="{{ form.username.id_for_label }}"
                                class="form-control form-control-lg"
                                autocomplete="username"
                                required
                            >
                            {% if form.username.errors %}
                                <div class="text-danger small mt-1">
                                    {{ form.username.errors }}
                                </div>
                            {% endif %}
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="{{ form.password.id_for_label }}">
                                Contraseña
                            </label>
                            <input
                                type="password"
                                name="{{ form.password.html_name }}"
                                id="{{ form.password.id_for_label }}"
                                class="form-control form-control-lg"
                                autocomplete="current-password"
                                required
                            >
                            {% if form.password.errors %}
                                <div class="text-danger small mt-1">
                                    {{ form.password.errors }}
                                </div>
                            {% endif %}
                        </div>

                        <button type="submit" class="btn btn-primary w-100 action-button">
                            Ingresar
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
