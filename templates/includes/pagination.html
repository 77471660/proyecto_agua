{% if page_obj.has_other_pages %}
    <nav class="mt-3 no-print" aria-label="Paginación">
        <ul class="pagination pagination-sm justify-content-center flex-wrap mb-0">
            {% if page_obj.has_previous %}
                <li class="page-item">
                    <a
                        class="page-link"
                        href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}{% if page_param %}{{ page_param }}{% else %}page{% endif %}={{ page_obj.previous_page_number }}"
                    >
                        Anterior
                    </a>
                </li>
            {% endif %}

            <li class="page-item active" aria-current="page">
                <span class="page-link">
                    Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}
                </span>
            </li>

            {% if page_obj.has_next %}
                <li class="page-item">
                    <a
                        class="page-link"
                        href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}{% if page_param %}{{ page_param }}{% else %}page{% endif %}={{ page_obj.next_page_number }}"
                    >
                        Siguiente
                    </a>
                </li>
            {% endif %}
        </ul>
    </nav>
{% endif %}
