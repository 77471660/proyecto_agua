{% extends 'base.html' %}

{% block title %}
Dashboard - AquaSmart CRM
{% endblock %}

{% block content %}

<div class="page-heading d-flex justify-content-between align-items-start flex-wrap gap-3">
    <div>
        <h2>
            Dashboard principal
        </h2>

        <small class="text-muted">
            Vista operativa de ventas, pedidos y cobros del dia
        </small>
    </div>

    <div class="ms-md-auto d-flex flex-column gap-2 align-items-stretch align-items-md-end">
        <form method="GET" action="/clientes/" class="w-100" style="max-width: 360px;">
            <div class="input-group input-group-sm">
                <input
                    type="text"
                    name="q"
                    autocomplete="off"
                    class="form-control"
                    placeholder="Buscar cliente, telefono o direccion..."
                    aria-label="Buscar cliente"
                >

                <button type="submit" class="btn btn-primary">
                    Buscar
                </button>
            </div>
        </form>

        <div class="d-flex gap-2 flex-wrap justify-content-start justify-content-md-end">
            <a href="/clientes/" class="btn btn-outline-dark">
                Ver clientes
            </a>

            <a href="/pedidos/" class="btn btn-primary">
                Ver pedidos
            </a>

            <a href="/registrar-pedido/" class="btn btn-success">
                Nuevo pedido
            </a>
        </div>
    </div>
</div>

<section
    id="dashboard-live-container"
    data-refresh-url="{% url 'dashboard_fragmento' %}{% if request.GET.urlencode %}?{{ request.GET.urlencode }}{% endif %}"
    data-refresh-ms="10000"
>
    {% include 'core/includes/dashboard_fragmento.html' %}
</section>

{% endblock %}
